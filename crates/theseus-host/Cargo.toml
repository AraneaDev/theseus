[package]
name = "theseus-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Private native host mechanisms for Theseus"

[features]
default = []
desktop-test-support = []
test-support = ["dep:serde", "dep:serde_json", "dep:tempfile", "dep:crossterm", "crossterm/theseus-test-support"]

[dependencies]
sha2 = "0.10.9"
crossterm = { version = "0.28.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = "0.3.18"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation", "Wdk_Foundation", "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_Globalization",
    "Win32_System_Pipes", "Win32_Security_Cryptography",
    "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Security_Authorization"] }
