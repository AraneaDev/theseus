name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT or App token lets the release PR trigger CI and the title check;
          # PRs opened with GITHUB_TOKEN start no workflows. Falls back until set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.release_created }}
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        if: ${{ steps.release.outputs.release_created }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: ${{ steps.release.outputs.release_created }}
      # The library tests need the trusted native fixture; this stage builds it
      # and exports THESEUS_HOST_TEST_FIXTURE through GITHUB_ENV.
      - name: Build trusted native application fixture
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mkdir -p "$RUNNER_TEMP/theseus-release-evidence"
          python3 scripts/validate.py native --stage fixture --evidence "$RUNNER_TEMP/theseus-release-evidence"
      - run: cargo test --locked -p theseus --lib
        if: ${{ steps.release.outputs.release_created }}
