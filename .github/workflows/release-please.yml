name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT or App token lets the release PR trigger CI and the title check;
          # PRs opened with GITHUB_TOKEN start no workflows. Falls back until set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A separate job so "Re-run failed jobs" retries validation of the released
  # commit; re-running release-please would not report release_created again.
  validate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The library tests need the trusted native fixture; this stage builds it
      # and exports THESEUS_HOST_TEST_FIXTURE through GITHUB_ENV.
      - name: Build trusted native application fixture
        run: |
          mkdir -p "$RUNNER_TEMP/theseus-release-evidence"
          python3 scripts/validate.py native --stage fixture --evidence "$RUNNER_TEMP/theseus-release-evidence"
      - run: cargo test --locked -p theseus --lib
