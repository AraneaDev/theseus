name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-package:
    name: host-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            host: aarch64-apple-darwin
          - os: windows-2025
            host: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record native toolchain and runner identity
        shell: pwsh
        env:
          THESEUS_HOST_EXPECTED: ${{ matrix.host }}
        run: |
          $theseusHostEvidence = Join-Path $env:RUNNER_TEMP 'theseus-host-package-evidence'
          New-Item -ItemType Directory -Force $theseusHostEvidence | Out-Null
          "THESEUS_HOST_EVIDENCE=$theseusHostEvidence" >> $env:GITHUB_ENV
          $theseusHostRustc = & rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $theseusHostRustc | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'rustc.txt')
          if ($theseusHostRustc -notcontains "host: $env:THESEUS_HOST_EXPECTED") {
            throw "Unexpected native compiler host; expected $env:THESEUS_HOST_EXPECTED"
          }
          @{
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            expected_host = $env:THESEUS_HOST_EXPECTED
            native_os_version = [Environment]::OSVersion.Version.ToString()
            native_os_build = [Environment]::OSVersion.Version.Build
          } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'runner.json')
      - name: Build trusted native application fixture
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage fixture --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ordinary inherited stdio qualification (required)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage stdio --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload ordinary stdio qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-stdio-preflight-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Workspace formatting
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage fmt --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native workspace all-target clippy
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage clippy --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable owned guest script bytes and preparation boundaries
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage portable --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify production and test native feature boundaries
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage features --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Precompile native diagnostic executables (required)
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage precompile --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native diagnostic bootstrap
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-bootstrap-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows legacy controls (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 1
        shell: pwsh
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage early-controls --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Early Unix resize and key controls (required)
        if: ${{ runner.os != 'Windows' }}
        timeout-minutes: 1
        shell: pwsh
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage early-controls --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native control diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-controls-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows CLI and terminal diagnostics (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 3
        shell: pwsh
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage early-cli --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Early Unix CLI and terminal diagnostics (required)
        if: ${{ runner.os != 'Windows' }}
        timeout-minutes: 3
        shell: pwsh
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage early-cli --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native CLI and terminal diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-cli-terminal-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows close MODEL (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 1
        uses: ./.github/actions/observe-conpty-model
        env:
          THESEUS_TERMINAL_TRACE: '1'
      - name: Upload native close MODEL diagnostic evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-close-model-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Full native application and explicit terminal acceptance
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage runtime --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Optimized native workspace build
        shell: pwsh
        run: |
          $theseusPython = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusPython scripts/validate.py native --stage release --evidence $env:THESEUS_HOST_EVIDENCE --expected-host '${{ matrix.host }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native workspace evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-evidence-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error

  docker:
    needs: host-package
    name: docker (all eight required suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Initialize total budget and all eight failure receipts
        timeout-minutes: 1
        shell: bash
        run: |
          theseus_acceptance_started=$(date +%s)
          theseus_evidence_dir="$RUNNER_TEMP/theseus-acceptance-evidence"
          mkdir -p "$theseus_evidence_dir"
          printf 'THESEUS_ACCEPTANCE_JOB_STARTED=%s\n' "$theseus_acceptance_started" >> "$GITHUB_ENV"
          printf 'THESEUS_ACCEPTANCE_EVIDENCE=%s\n' "$theseus_evidence_dir" >> "$GITHUB_ENV"
          printf 'All eight required suites have independent directories and result.json; absent, failed preparation and not-run results are failures.\n' > "$theseus_evidence_dir/README.txt"
          printf '%s\n' "$GITHUB_SHA" > "$theseus_evidence_dir/source-sha.txt"
          for theseus_target in docker_lifecycle interruption_lifecycle downgrade_lifecycle rollback_lifecycle interrupted_rollback_lifecycle comparison_docker mcp_docker mcp_server_docker; do
            mkdir -p "$theseus_evidence_dir/$theseus_target"
            printf '{"suite":"%s","status":"not_run_preparation","pass":false}\n' "$theseus_target" > "$theseus_evidence_dir/$theseus_target/result.json"
          done
      # These fixed setup caps total at most 16 minutes from the first step;
      # all following commands share that same 70-minute clock with 15 seconds reserved for watchdog receipts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
      - name: Prepare image and trusted native targets within total budget
        id: prepare
        shell: bash
        run: |
          python3 scripts/validate.py docker --stage prepare --evidence "$THESEUS_ACCEPTANCE_EVIDENCE" --budget-start "$THESEUS_ACCEPTANCE_JOB_STARTED" --expected-host x86_64-unknown-linux-gnu
      - name: Real Docker acceptance (all eight required)
        shell: bash
        run: |
          python3 scripts/validate.py docker --stage run --evidence "$THESEUS_ACCEPTANCE_EVIDENCE" --budget-start "$THESEUS_ACCEPTANCE_JOB_STARTED" --expected-host x86_64-unknown-linux-gnu
      - name: Finalize preparation failure evidence
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        env:
          THESEUS_PREPARATION_RESULT: ${{ steps.prepare.outcome }}
        run: |
          printf '{"preparation":"%s","all_eight_receipts_initialized_before_setup":true}\n' "$THESEUS_PREPARATION_RESULT" > "$THESEUS_ACCEPTANCE_EVIDENCE/preparation.json"
      - name: Upload all eight acceptance suites and results
        if: ${{ always() }}
        timeout-minutes: 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-evidence-all-eight
          path: ${{ env.THESEUS_ACCEPTANCE_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
