name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set acceptance evidence path
        run: |
          printf 'THESEUS_ACCEPTANCE_EVIDENCE=%s/theseus-acceptance-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Prepare Docker acceptance image
        run: |
          docker info
          docker pull ubuntu:24.04
      - name: Real Docker lifecycle acceptance (required)
        run: cargo test --locked --test docker_lifecycle -- --ignored --test-threads=1

      - name: Real Docker interruption acceptance (required)
        run: cargo test --locked --test interruption_lifecycle -- --ignored --test-threads=1

      - name: Real Docker downgrade acceptance (required)
        run: cargo test --locked --test downgrade_lifecycle -- --ignored --test-threads=1

      - name: Real Docker rollback acceptance (required)
        run: cargo test --locked --test rollback_lifecycle -- --ignored --test-threads=1

      - name: Real Docker interrupted rollback acceptance (required)
        run: cargo test --locked --test interrupted_rollback_lifecycle -- --ignored --test-threads=1

      - name: Real comparison Docker and PTY acceptance (required)
        run: cargo test --locked --test comparison_docker -- --ignored --test-threads=1

      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-evidence
          path: ${{ runner.temp }}/theseus-acceptance-evidence
          retention-days: 7
          if-no-files-found: warn
