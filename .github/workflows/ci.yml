name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-package:
    name: host-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            host: aarch64-apple-darwin
          - os: windows-2025
            host: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record native toolchain and runner identity
        shell: pwsh
        env:
          THESEUS_HOST_EXPECTED: ${{ matrix.host }}
        run: |
          $theseusHostEvidence = Join-Path $env:RUNNER_TEMP 'theseus-host-package-evidence'
          New-Item -ItemType Directory -Force $theseusHostEvidence | Out-Null
          "THESEUS_HOST_EVIDENCE=$theseusHostEvidence" >> $env:GITHUB_ENV
          $theseusHostRustc = & rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $theseusHostRustc | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'rustc.txt')
          if ($theseusHostRustc -notcontains "host: $env:THESEUS_HOST_EXPECTED") {
            throw "Unexpected native compiler host; expected $env:THESEUS_HOST_EXPECTED"
          }
          @{
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            expected_host = $env:THESEUS_HOST_EXPECTED
            native_os_version = [Environment]::OSVersion.Version.ToString()
            native_os_build = [Environment]::OSVersion.Version.Build
          } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'runner.json')
      - name: Workspace formatting
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: cargo fmt --all --check
      - name: Native workspace all-target clippy
        shell: pwsh
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'clippy.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable owned guest script bytes and preparation boundaries
        shell: pwsh
        run: |
          $theseusTask6Python = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusTask6Python --version 2>&1 | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'python-version.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $theseusTask6Python tests/support/portable_guest_bytes.py 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'portable-guest-bytes.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build trusted native application fixture
        shell: pwsh
        run: |
          $theseusTask7Python = if ($IsWindows) { 'python' } else { 'python3' }
          $theseusTask7Fixture = & $theseusTask7Python tests/support/build_host_fixture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "THESEUS_HOST_TEST_FIXTURE=$theseusTask7Fixture" >> $env:GITHUB_ENV
          Copy-Item (Join-Path (Split-Path $theseusTask7Fixture) 'artifacts.json') (Join-Path $env:THESEUS_HOST_EVIDENCE 'native-artifacts.json')
          @{ source_sha = $env:GITHUB_SHA; executable = $theseusTask7Fixture; sha256 = (Get-FileHash -Algorithm SHA256 $theseusTask7Fixture).Hash } |
            ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-fixture.json')
      - name: Verify production and test native feature boundaries
        shell: pwsh
        run: |
          $theseusReleaseMetadata = Join-Path $env:THESEUS_HOST_EVIDENCE 'release-artifacts.jsonl'
          cargo check --locked --release --bin theseus --message-format=json 2> (Join-Path $env:THESEUS_HOST_EVIDENCE 'release-check.stderr') |
            Tee-Object -FilePath $theseusReleaseMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $theseusReleaseHost = @(Get-Content $theseusReleaseMetadata | ConvertFrom-Json | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theseus_host' })
          if ($theseusReleaseHost.Count -lt 1 -or @($theseusReleaseHost | Where-Object { $_.features -contains 'test-support' }).Count -ne 0) { throw 'Production release unexpectedly enables native faults' }
          $theseusTestMetadata = Join-Path $env:THESEUS_HOST_EVIDENCE 'app-test-artifacts.jsonl'
          cargo test --locked --lib --no-run --message-format=json 2> (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-test-build.stderr') |
            Tee-Object -FilePath $theseusTestMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $theseusTestHost = @(Get-Content $theseusTestMetadata | ConvertFrom-Json | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'theseus_host' -and $_.features -contains 'test-support' })
          if ($theseusTestHost.Count -lt 1) { throw 'Application test graph lacks scoped native fault support' }
      - name: Precompile native diagnostic executables (required)
        shell: pwsh
        run: |
          cargo test --locked -p theseus-host --features test-support --lib --no-run 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'native-host-precompile.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test host_cli --test host_terminal --no-run 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'native-integration-precompile.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native diagnostic bootstrap
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-bootstrap-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows legacy controls (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 1
        shell: cmd
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          echo THESEUS diagnostic=legacy phase=start
          cargo test --locked -p theseus-host --features test-support --lib conpty_legacy_crossterm -- --nocapture --test-threads=1 > "%THESEUS_HOST_EVIDENCE%\early-native-legacy-crossterm.log" 2>&1
          set "theseusDiagnosticExit=%ERRORLEVEL%"
          if not exist "%THESEUS_HOST_EVIDENCE%\early-native-legacy-crossterm.log" exit /b 1
          type "%THESEUS_HOST_EVIDENCE%\early-native-legacy-crossterm.log"
          if errorlevel 1 exit /b 1
          echo THESEUS diagnostic=legacy phase=returned exit=%theseusDiagnosticExit%
          exit /b %theseusDiagnosticExit%
      - name: Early Unix resize and key controls (required)
        if: ${{ runner.os != 'Windows' }}
        timeout-minutes: 1
        shell: bash
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          printf 'THESEUS diagnostic=resize-key phase=start\n'
          if cargo test --locked -p theseus-host --features test-support --lib pty_resize_and_single_q -- --nocapture --test-threads=1 > "$THESEUS_HOST_EVIDENCE/early-native-resize-key-control.log" 2>&1; then
            theseus_diagnostic_exit=0
          else
            theseus_diagnostic_exit=$?
          fi
          cat "$THESEUS_HOST_EVIDENCE/early-native-resize-key-control.log"
          printf 'THESEUS diagnostic=resize-key phase=returned exit=%s\n' "$theseus_diagnostic_exit"
          exit "$theseus_diagnostic_exit"
      - name: Upload native control diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-controls-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows CLI and terminal diagnostics (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 3
        shell: cmd
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          echo THESEUS diagnostic=cli-terminal phase=start
          cargo test --locked --test host_cli --test host_terminal -- --nocapture --test-threads=1 > "%THESEUS_HOST_EVIDENCE%\early-native-cli-terminal.log" 2>&1
          set "theseusDiagnosticExit=%ERRORLEVEL%"
          if not exist "%THESEUS_HOST_EVIDENCE%\early-native-cli-terminal.log" exit /b 1
          type "%THESEUS_HOST_EVIDENCE%\early-native-cli-terminal.log"
          if errorlevel 1 exit /b 1
          echo THESEUS diagnostic=cli-terminal phase=returned exit=%theseusDiagnosticExit%
          exit /b %theseusDiagnosticExit%
      - name: Early Unix CLI and terminal diagnostics (required)
        if: ${{ runner.os != 'Windows' }}
        timeout-minutes: 3
        shell: bash
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          printf 'THESEUS diagnostic=cli-terminal phase=start\n'
          if cargo test --locked --test host_cli --test host_terminal -- --nocapture --test-threads=1 > "$THESEUS_HOST_EVIDENCE/early-native-cli-terminal.log" 2>&1; then
            theseus_diagnostic_exit=0
          else
            theseus_diagnostic_exit=$?
          fi
          cat "$THESEUS_HOST_EVIDENCE/early-native-cli-terminal.log"
          printf 'THESEUS diagnostic=cli-terminal phase=returned exit=%s\n' "$theseus_diagnostic_exit"
          exit "$theseus_diagnostic_exit"
      - name: Upload native CLI and terminal diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-cli-terminal-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Early Windows close MODEL (required)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 1
        shell: cmd
        env:
          THESEUS_TERMINAL_TRACE: '1'
        run: |
          echo THESEUS diagnostic=close-model phase=start
          cargo test --locked -p theseus-host --features test-support --lib conpty_backpressure_close_model -- --nocapture --test-threads=1 > "%THESEUS_HOST_EVIDENCE%\early-native-conpty-close-model.log" 2>&1
          set "theseusDiagnosticExit=%ERRORLEVEL%"
          if not exist "%THESEUS_HOST_EVIDENCE%\early-native-conpty-close-model.log" exit /b 1
          type "%THESEUS_HOST_EVIDENCE%\early-native-conpty-close-model.log"
          if errorlevel 1 exit /b 1
          echo THESEUS diagnostic=close-model phase=returned exit=%theseusDiagnosticExit%
          exit /b %theseusDiagnosticExit%
      - name: Upload native close MODEL diagnostic evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-close-model-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Full native application and explicit terminal acceptance
        shell: pwsh
        run: |
          function Invoke-TheseusRuntimeGate {
            param([ValidateSet('workspace', 'cli-terminal', 'windows-model', 'unix-master')][string]$Gate)
            # Only these repository-owned literal commands can reach an OS shell.
            switch ($Gate) {
              'workspace' { $theseusGateCommand = 'cargo test --locked --workspace --all-targets --no-fail-fast'; $theseusGateLog = 'workspace-tests.log' }
              'cli-terminal' { $theseusGateCommand = 'cargo test --locked --test host_cli --test host_terminal -- --nocapture'; $theseusGateLog = 'native-cli-terminal.log' }
              'windows-model' { $theseusGateCommand = 'cargo test --locked -p theseus-host --features test-support --lib conpty_backpressure_close_model -- --nocapture'; $theseusGateLog = 'native-conpty-close-model.log' }
              'unix-master' { $theseusGateCommand = 'cargo test --locked -p theseus-host --features test-support --lib pty_master_ -- --nocapture'; $theseusGateLog = 'native-pty-mode-controls.log' }
            }
            $env:THESEUS_RUNTIME_LOG = Join-Path $env:THESEUS_HOST_EVIDENCE $theseusGateLog
            Write-Output "THESEUS runtime=$Gate phase=start"
            if ($IsWindows) {
              $theseusGateScript = Join-Path $env:RUNNER_TEMP "theseus-runtime-$Gate.cmd"
              $theseusGateRedirect = ' > "%THESEUS_RUNTIME_LOG%" 2>&1'
              @("$theseusGateCommand$theseusGateRedirect", 'exit /b %ERRORLEVEL%') | Set-Content -Encoding ascii $theseusGateScript
              & $env:ComSpec /d /c $theseusGateScript
            } else {
              $theseusGateScript = Join-Path $env:RUNNER_TEMP "theseus-runtime-$Gate.sh"
              $theseusGateRedirect = ' > "$THESEUS_RUNTIME_LOG" 2>&1'
              @("$theseusGateCommand$theseusGateRedirect", 'exit $?') | Set-Content -Encoding ascii $theseusGateScript
              & bash --noprofile --norc $theseusGateScript
            }
            $theseusGateExit = $LASTEXITCODE
            if (-not (Test-Path -LiteralPath $env:THESEUS_RUNTIME_LOG -PathType Leaf)) { throw "Missing required native runtime log for $Gate" }
            Get-Content -LiteralPath $env:THESEUS_RUNTIME_LOG
            Write-Output "THESEUS runtime=$Gate phase=returned exit=$theseusGateExit"
            if ($theseusGateExit -ne 0) { exit $theseusGateExit }
          }
          $theseusTask7Template = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/recipes/v4_downgrade.toml'
          $theseusTask7TemplateBytes = [System.IO.File]::ReadAllBytes($theseusTask7Template)
          [System.IO.File]::WriteAllBytes((Join-Path $env:THESEUS_HOST_EVIDENCE 'engine-downgrade-template.raw'), $theseusTask7TemplateBytes)
          $theseusTask7Lf = 0
          $theseusTask7Crlf = 0
          for ($theseusTask7Index = 0; $theseusTask7Index -lt $theseusTask7TemplateBytes.Length; $theseusTask7Index++) {
            if ($theseusTask7TemplateBytes[$theseusTask7Index] -eq 10) {
              $theseusTask7Lf++
              if ($theseusTask7Index -gt 0 -and $theseusTask7TemplateBytes[$theseusTask7Index - 1] -eq 13) { $theseusTask7Crlf++ }
            }
          }
          @{ source_sha = $env:GITHUB_SHA; byte_count = $theseusTask7TemplateBytes.Length; lf_bytes = $theseusTask7Lf; crlf_pairs = $theseusTask7Crlf; bare_lf = ($theseusTask7Lf - $theseusTask7Crlf); sha256 = (Get-FileHash -Algorithm SHA256 $theseusTask7Template).Hash } |
            ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'engine-template-bytes.json')
          if ($IsMacOS) {
            $theseusTask7TempRoot = python3 -c "import pathlib, tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve())"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:TMPDIR = $theseusTask7TempRoot
            @{ source_sha = $env:GITHUB_SHA; canonical_temp_root = $theseusTask7TempRoot; fixture_policy = 'canonical native temp ancestry; strict production roots unchanged' } |
              ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-process-fixture-policy.json')
          }
          Invoke-TheseusRuntimeGate workspace
          Invoke-TheseusRuntimeGate cli-terminal
          if ($IsWindows) {
            Invoke-TheseusRuntimeGate windows-model
          } else {
            Invoke-TheseusRuntimeGate unix-master
          }
          $theseusPinnedArtifacts = Get-Content (Join-Path $env:THESEUS_HOST_EVIDENCE 'native-artifacts.json') | ConvertFrom-Json
          foreach ($theseusPinnedArtifact in @($theseusPinnedArtifacts.fixture, $theseusPinnedArtifacts.application)) {
            if ((Get-FileHash -Algorithm SHA256 $theseusPinnedArtifact.path).Hash.ToLowerInvariant() -ne $theseusPinnedArtifact.sha256) { throw 'Pinned native artifact changed during workspace tests' }
          }
          $theseusPinnedArtifacts | ConvertTo-Json -Depth 30 | Set-Content (Join-Path $env:THESEUS_HOST_EVIDENCE 'native-artifacts-after.json')
      - name: Optimized native workspace build
        shell: pwsh
        run: |
          cargo build --locked --workspace --release 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'workspace-release.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native workspace evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-evidence-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error

  docker:
    needs: [host-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - docker_lifecycle
          - interruption_lifecycle
          - downgrade_lifecycle
          - rollback_lifecycle
          - interrupted_rollback_lifecycle
          - comparison_docker
          - mcp_docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set acceptance evidence paths
        env:
          THESEUS_ACCEPTANCE_TARGET: ${{ matrix.target }}
        run: |
          theseus_evidence_dir="$RUNNER_TEMP/theseus-acceptance-evidence-$THESEUS_ACCEPTANCE_TARGET"
          mkdir -p "$theseus_evidence_dir"
          printf 'THESEUS_ACCEPTANCE_EVIDENCE=%s\n' "$theseus_evidence_dir" >> "$GITHUB_ENV"
          printf 'THESEUS_MCP_TEST_EVIDENCE=%s/mcp-transport\n' "$theseus_evidence_dir" >> "$GITHUB_ENV"
      - name: Prepare Docker acceptance image
        run: |
          docker info
          docker pull ubuntu:24.04
          theseus_image_id="$(docker image inspect --format '{{.Id}}' ubuntu:24.04)"
          printf 'THESEUS_MCP_TEST_IMAGE=%s\n' "$theseus_image_id" >> "$GITHUB_ENV"
          printf '%s\n' "$theseus_image_id" | tee "$THESEUS_ACCEPTANCE_EVIDENCE/docker-image-id.txt"
      - name: Build trusted native application fixture
        run: |
          theseus_fixture="$(python3 tests/support/build_host_fixture.py)"
          printf 'THESEUS_HOST_TEST_FIXTURE=%s\n' "$theseus_fixture" >> "$GITHUB_ENV"
      - name: Real Docker acceptance (required)
        env:
          THESEUS_ACCEPTANCE_TARGET: ${{ matrix.target }}
        run: cargo test --locked --test "$THESEUS_ACCEPTANCE_TARGET" -- --ignored --test-threads=1
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-evidence-${{ matrix.target }}
          path: ${{ env.THESEUS_ACCEPTANCE_EVIDENCE }}
          retention-days: 7
          if-no-files-found: warn
