name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-package:
    name: host-package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            host: aarch64-apple-darwin
          - os: windows-2025
            host: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Record native toolchain and runner identity
        shell: pwsh
        env:
          THESEUS_HOST_EXPECTED: ${{ matrix.host }}
        run: |
          $theseusHostEvidence = Join-Path $env:RUNNER_TEMP 'theseus-host-package-evidence'
          New-Item -ItemType Directory -Force $theseusHostEvidence | Out-Null
          "THESEUS_HOST_EVIDENCE=$theseusHostEvidence" >> $env:GITHUB_ENV
          $theseusHostRustc = & rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $theseusHostRustc | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'rustc.txt')
          if ($theseusHostRustc -notcontains "host: $env:THESEUS_HOST_EXPECTED") {
            throw "Unexpected native compiler host; expected $env:THESEUS_HOST_EXPECTED"
          }
          @{
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            expected_host = $env:THESEUS_HOST_EXPECTED
          } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $theseusHostEvidence 'runner.json')
      - name: Native package clippy
        shell: pwsh
        run: |
          cargo clippy --locked -p theseus-host --all-targets -- -D warnings 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'clippy.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native package tests
        shell: pwsh
        run: |
          cargo test --locked -p theseus-host --all-targets --no-fail-fast 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable owned guest script bytes and preparation boundaries
        shell: pwsh
        run: |
          $theseusTask6Python = if ($IsWindows) { 'python' } else { 'python3' }
          & $theseusTask6Python --version 2>&1 | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'python-version.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $theseusTask6Python tests/support/portable_guest_bytes.py 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'portable-guest-bytes.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native macOS application storage integration
        if: ${{ runner.os == 'macOS' }}
        shell: pwsh
        run: |
          $theseusTask6TempRoot = python3 -c "import pathlib, tempfile; print(pathlib.Path(tempfile.gettempdir()).resolve())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TMPDIR = $theseusTask6TempRoot
          @{ source_sha = $env:GITHUB_SHA; canonical_temp_root = $theseusTask6TempRoot; fixture_policy = 'canonical native temp ancestry; production strict no-follow remains unchanged' } |
            ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-storage-fixture-policy.json')
          cargo test --locked --lib report::store 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-storage-unit.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib runner::artifacts 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-artifacts-unit.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib tui::view::changed_log_tests 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-cache-unit.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test reports --test log_pages --test comparison_store --test preview_documents --test recipe --test tui_paging --test mcp_examples --test plugin_examples 2>&1 |
            Tee-Object -FilePath (Join-Path $env:THESEUS_HOST_EVIDENCE 'app-storage-integration.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-package-evidence-${{ matrix.os }}
          path: ${{ env.THESEUS_HOST_EVIDENCE }}
          retention-days: 7
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  docker:
    needs: [linux, host-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - docker_lifecycle
          - interruption_lifecycle
          - downgrade_lifecycle
          - rollback_lifecycle
          - interrupted_rollback_lifecycle
          - comparison_docker
          - mcp_docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set acceptance evidence paths
        env:
          TARGET: ${{ matrix.target }}
        run: |
          evidence_dir="$RUNNER_TEMP/theseus-acceptance-evidence-$TARGET"
          mkdir -p "$evidence_dir"
          printf 'THESEUS_ACCEPTANCE_EVIDENCE=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'THESEUS_MCP_TEST_EVIDENCE=%s/mcp-transport\n' "$evidence_dir" >> "$GITHUB_ENV"
      - name: Prepare Docker acceptance image
        run: |
          docker info
          docker pull ubuntu:24.04
          image_id="$(docker image inspect --format '{{.Id}}' ubuntu:24.04)"
          printf 'THESEUS_MCP_TEST_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf '%s\n' "$image_id" | tee "$THESEUS_ACCEPTANCE_EVIDENCE/docker-image-id.txt"
      - name: Real Docker acceptance (required)
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --test "$TARGET" -- --ignored --test-threads=1
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-evidence-${{ matrix.target }}
          path: ${{ env.THESEUS_ACCEPTANCE_EVIDENCE }}
          retention-days: 7
          if-no-files-found: warn
