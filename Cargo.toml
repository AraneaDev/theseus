[package]
name = "theseus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Installation lifecycle workbench with Docker evidence and a terminal UI"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
sha2 = "0.10.9"
rustix = { version = "1.1.5", features = ["fs", "process"] }

tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
signal-hook = "0.3.18"

ratatui = "0.29.0"
crossterm = "0.28.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
