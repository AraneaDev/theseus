[workspace]
members = ["crates/theseus-host"]
resolver = "3"

[package]
name = "theseus"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "Installation lifecycle workbench with Docker evidence and a terminal UI"

[dependencies]
theseus-host = { path = "crates/theseus-host" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
sha2 = "0.10.9"
rustix = { version = "1.1.5", features = ["fs", "process"] }

tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
signal-hook = "0.3.18"

ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = "0.28.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
